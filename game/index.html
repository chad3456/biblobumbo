<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#ff9933" />
    <title>NaMo Bricks — The Election Run</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect x='10' y='30' width='80' height='60' rx='8' fill='%23ff9933' stroke='%23111' stroke-width='6'/><rect x='22' y='14' width='22' height='18' rx='4' fill='%23ff9933' stroke='%23111' stroke-width='6'/><rect x='56' y='14' width='22' height='18' rx='4' fill='%23ff9933' stroke='%23111' stroke-width='6'/></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <main class="wrap">
      <div class="frame">
        <canvas id="screen" width="960" height="540" aria-label="NaMo Bricks game screen"></canvas>
        <div id="overlay" hidden></div>
        <button id="mute" class="mute" aria-label="toggle sound">🔊</button>
      </div>
      <div class="pad" aria-hidden="true">
        <div class="pad-left">
          <button data-key="left">◀</button>
          <button data-key="right">▶</button>
        </div>
        <div class="pad-right">
          <button data-key="run" class="small">RUN</button>
          <button data-key="jump" class="jump">JUMP</button>
        </div>
      </div>
    </main>
    <script type="module" src="/src/game/main.ts"></script>
  </body>
</html>
